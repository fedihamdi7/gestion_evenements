server.port=8081

spring.application.name=service-utilisateurs

# MySQL — createDatabaseIfNotExist=true creates db_utilisateurs automatically on first run
spring.datasource.url=jdbc:mysql://localhost:3306/db_utilisateurs?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA — Hibernate creates/updates the "utilisateurs" table automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka — register this service under the name "service-utilisateurs"
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info

# Include the exception message in error responses so the frontend can show "Email deja utilise", etc.
server.error.include-message=always

# ---------------------------------------------------------------------------
# Keycloak (login server). Start it with ./keycloak/run-keycloak.ps1 (admin/admin).
# ---------------------------------------------------------------------------
keycloak.base-url=${KEYCLOAK_BASE_URL:http://localhost:8080}
keycloak.realm=gestion-evenements
keycloak.client-id=service-utilisateurs
# Master admin used ONLY to manage users via Keycloak's Admin REST API (dev defaults).
keycloak.admin.client-id=admin-cli
keycloak.admin.username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin}

# This service is an OAuth2 Resource Server: it validates Keycloak JWTs using Keycloak's
# public keys (JWKS). jwk-set-uri is fetched lazily, so this service still BOOTS if Keycloak
# is temporarily down (calls to secured endpoints just return 401 until Keycloak is up).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${keycloak.base-url}/realms/${keycloak.realm}/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.issuer-uri=${keycloak.base-url}/realms/${keycloak.realm}
