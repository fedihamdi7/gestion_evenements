server.port=9090

# Routes — lb:// means "look up the address in Eureka by service name" (no hard-coded IP/port)
spring.cloud.gateway.server.webflux.routes[0].id=service-utilisateurs
spring.cloud.gateway.server.webflux.routes[0].uri=lb://service-utilisateurs
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.server.webflux.routes[1].id=service-evenements
spring.cloud.gateway.server.webflux.routes[1].uri=lb://service-evenements
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/events/**

spring.cloud.gateway.server.webflux.routes[2].id=service-avis
spring.cloud.gateway.server.webflux.routes[2].uri=lb://service-avis
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/avis/**

spring.cloud.gateway.server.webflux.routes[3].id=service-reservation
spring.cloud.gateway.server.webflux.routes[3].uri=lb://service-reservation
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/reservations/**

spring.cloud.gateway.server.webflux.routes[4].id=service-messaging
spring.cloud.gateway.server.webflux.routes[4].uri=lb://service-messaging
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/messages/**

# Socket.IO (real-time chat) — proxied through the gateway as a WebSocket.
spring.cloud.gateway.server.webflux.routes[5].id=messaging-socketio
spring.cloud.gateway.server.webflux.routes[5].uri=lb://service-messaging
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/socket.io/**

# ---------------------------------------------------------------------------
# Swagger / OpenAPI aggregation.
# Open http://localhost:9090/swagger-ui.html and use the top-right dropdown to
# switch between every microservice's API — all fetched THROUGH the gateway.
# Each url below is the docs path that the matching service serves under its route.
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=service-utilisateurs
springdoc.swagger-ui.urls[0].url=/api/users/v3/api-docs
springdoc.swagger-ui.urls[1].name=service-evenements
springdoc.swagger-ui.urls[1].url=/api/events/v3/api-docs
springdoc.swagger-ui.urls[2].name=service-avis
springdoc.swagger-ui.urls[2].url=/api/avis/v3/api-docs
springdoc.swagger-ui.urls[3].name=service-reservation
springdoc.swagger-ui.urls[3].url=/api/reservations/v3/api-docs

# ---------------------------------------------------------------------------
# Security — the gateway validates the Keycloak JWT on every route (see SecurityConfig).
# Same Keycloak coordinates as service-utilisateurs, so tokens are accepted consistently.
# jwk-set-uri is fetched lazily, so the gateway still BOOTS if Keycloak is momentarily down.
# ---------------------------------------------------------------------------
keycloak.base-url=${KEYCLOAK_BASE_URL:http://${KEYCLOAK_HOST:localhost}:8080}
keycloak.realm=gestion-evenements
spring.security.oauth2.resourceserver.jwt.issuer-uri=${keycloak.base-url}/realms/${keycloak.realm}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${keycloak.base-url}/realms/${keycloak.realm}/protocol/openid-connect/certs

# Actuator
management.endpoints.web.exposure.include=health,info,gateway,prometheus
