server:
  port: 8082

spring:
  application:
    name: service-evenements        # the name Eureka and the gateway (lb://service-evenements) use

  data:
    mongodb:
      database: db_evenements

de:
  flapdoodle:
    mongodb:
      embedded:
        version: 7.0.0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/   # where the Eureka registry lives
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info