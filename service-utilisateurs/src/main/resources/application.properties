server.port=8081

spring.application.name=service-utilisateurs

# MySQL — createDatabaseIfNotExist=true creates db_utilisateurs automatically on first run
spring.datasource.url=jdbc:mysql://localhost:3306/db_utilisateurs?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA — Hibernate creates/updates the "utilisateurs" table automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka — register this service under the name "service-utilisateurs"
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info
