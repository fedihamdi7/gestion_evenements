server.port=8888

spring.application.name=config-server

# "native" backend = serve plain files from a folder (no Git needed).
# We bundle every service's config inside this module under /config.
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=classpath:/config/

# Actuator (lets you check health at http://localhost:8888/actuator/health)
management.endpoints.web.exposure.include=health,info

# Register in Eureka (visible in the registry dashboard). EUREKA_HOST defaults to localhost
# and is set to "eureka-server" by docker-compose. Registration retries in the background,
# so the Config Server still starts fine before Eureka is up (it doesn't depend on Eureka).
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false
