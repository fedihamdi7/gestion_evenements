# =============================================================================
# Full stack in Docker — one command runs EVERYTHING:
#   docker compose up --build
#
# Infra:   mysql, rabbitmq, keycloak
# Core:    config-server -> eureka-server
# Services: utilisateurs, evenements, avis, reservation, messaging
# Edge:    api-gateway (single entry point + JWT security)
# Monitoring: prometheus + grafana
#
# Inside Docker services find each other by SERVICE NAME, so we pass EUREKA_HOST,
# MYSQL_HOST, KEYCLOAK_HOST, RABBITMQ_HOST, CONFIG_SERVER_URL to override the
# ${...:localhost} placeholders in the centralized config.
# =============================================================================

services:

  # ---------------- Infrastructure ----------------
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      # host 3307 -> container 3306, to avoid clashing with the local MySQL84 service on 3306.
      # (services inside Docker still reach it as mysql:3306 on the internal network.)
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [esprit-net]

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [esprit-net]

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    container_name: keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      JAVA_OPTS_KC_HEAP: "-Xms64m -Xmx512m"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks: [esprit-net]

  # ---------------- Config Server (everyone waits on it) ----------------
  config-server:
    build: ./config-server
    container_name: config-server
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx200m -XX:+UseSerialGC -Xss512k"
      EUREKA_HOST: eureka-server
      EUREKA_INSTANCE_HOSTNAME: config-server
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [esprit-net]

  # ---------------- Eureka registry ----------------
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx200m -XX:+UseSerialGC -Xss512k"
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [esprit-net]

  # ---------------- Business services ----------------
  service-utilisateurs:
    build: ./service-utilisateurs
    container_name: service-utilisateurs
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+UseSerialGC -Xss512k"
      # the mysql CONTAINER root password is "root"; the config default is empty (for a
      # local passwordless MySQL), so we must set it here or the DB connection is refused.
      SPRING_DATASOURCE_PASSWORD: root
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_HOST: eureka-server
      MYSQL_HOST: mysql
      KEYCLOAK_HOST: keycloak
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8081:8081"
    depends_on:
      config-server: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      mysql: { condition: service_healthy }
      keycloak: { condition: service_started }
      rabbitmq: { condition: service_started }
    restart: unless-stopped
    networks: [esprit-net]

  service-evenements:
    build: ./service-evenements
    container_name: service-evenements
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+UseSerialGC -Xss512k"
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_HOST: eureka-server
      # its config sets hostname=localhost/prefer-ip-address=false (fine locally, wrong in
      # Docker). Override so it registers by container IP and the gateway can reach it.
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      EUREKA_INSTANCE_HOSTNAME: service-evenements
    ports:
      - "8082:8082"
    depends_on:
      config-server: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    restart: unless-stopped
    networks: [esprit-net]

  service-avis:
    build: ./service-avis
    container_name: service-avis
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+UseSerialGC -Xss512k"
      SPRING_DATASOURCE_PASSWORD: root   # mysql container root password (config default is empty)
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_HOST: eureka-server
      MYSQL_HOST: mysql
    ports:
      - "8083:8083"
    depends_on:
      config-server: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      mysql: { condition: service_healthy }
    restart: unless-stopped
    networks: [esprit-net]

  service-reservation:
    build: ./ReservationEvenement
    container_name: service-reservation
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+UseSerialGC -Xss512k"
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_HOST: eureka-server
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8084:8084"
    depends_on:
      config-server: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      rabbitmq: { condition: service_started }
    restart: unless-stopped
    networks: [esprit-net]

  service-messaging:
    build: ./service-messaging
    container_name: service-messaging
    environment:
      EUREKA_HOST: eureka-server
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: root   # mysql container root password (code default is empty)
      PORT: 8085
      # register in Eureka under the container name so the gateway can reach it
      INSTANCE_HOST: service-messaging
      INSTANCE_IP: service-messaging
    ports:
      - "8085:8085"
    depends_on:
      eureka-server: { condition: service_healthy }
      mysql: { condition: service_healthy }
    restart: unless-stopped
    networks: [esprit-net]

  # ---------------- API Gateway (entry point + JWT security) ----------------
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+UseSerialGC -Xss512k"
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_HOST: eureka-server
      KEYCLOAK_HOST: keycloak
    ports:
      - "9090:9090"
    depends_on:
      config-server: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      keycloak: { condition: service_started }
    restart: unless-stopped
    networks: [esprit-net]

  # ---------------- Monitoring ----------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus-full.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9095:9090"
    depends_on:
      - api-gateway
    networks: [esprit-net]

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks: [esprit-net]

  # ---------------- phpMyAdmin (browse the MySQL databases) ----------------
  # http://localhost:8090  — auto-logged in as root/root. Shows db_utilisateurs,
  # db_avis, db_messaging. (reservation uses in-memory H2, events uses Mongo — not here.)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 64M
    ports:
      - "8090:80"
    depends_on:
      - mysql
    networks: [esprit-net]

  # ---------------- Frontend (Angular, served by nginx) ----------------
  # http://localhost:4200 — static SPA. The browser calls the gateway at
  # http://localhost:9090 (host-mapped), so no build-time API URL change is needed.
  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - api-gateway
    networks: [esprit-net]

volumes:
  mysql_data:

networks:
  esprit-net:
    driver: bridge
