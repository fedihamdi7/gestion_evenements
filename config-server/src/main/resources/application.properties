server.port=8888

spring.application.name=config-server

# "native" backend = serve plain files from a folder (no Git needed).
# We bundle every service's config inside this module under /config.
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=classpath:/config/

# Actuator (lets you check health at http://localhost:8888/actuator/health)
management.endpoints.web.exposure.include=health,info
