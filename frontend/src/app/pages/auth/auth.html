<div class="auth-wrap">
  <div class="card">
    <div class="tabs">
      <button [class.active]="tab() === 'login'" (click)="switchTab('login')">Connexion</button>
      <button [class.active]="tab() === 'register'" (click)="switchTab('register')">Inscription</button>
    </div>

    @if (message(); as m) {
      <div class="msg" [class.ok]="m.ok" [class.err]="!m.ok">{{ m.text }}</div>
    }

    @if (tab() === 'login') {
      <form (ngSubmit)="login()">
        <label>Email</label>
        <input type="email" name="lEmail" [(ngModel)]="loginEmail" required />
        <label>Mot de passe</label>
        <input type="password" name="lPass" [(ngModel)]="loginPass" required />
        <div class="mt">
          <button type="submit" [disabled]="loading()">
            {{ loading() ? '…' : 'Se connecter' }}
          </button>
        </div>
      </form>
    } @else {
      <form (ngSubmit)="register()">
        <div class="row">
          <div style="flex: 1">
            <label>Nom</label>
            <input name="nom" [(ngModel)]="reg.nom" required />
          </div>
          <div style="flex: 1">
            <label>Prénom</label>
            <input name="prenom" [(ngModel)]="reg.prenom" required />
          </div>
        </div>
        <label>Email</label>
        <input type="email" name="rEmail" [(ngModel)]="reg.email" required />
        <label>Mot de passe (min 6)</label>
        <input type="password" name="rPass" [(ngModel)]="reg.motDePasse" minlength="6" required />
        <p class="hint">
          Vous serez inscrit comme <strong>PARTICIPANT</strong>. Un administrateur pourra
          vous attribuer un autre rôle par la suite.
        </p>
        <div class="mt">
          <button type="submit" [disabled]="loading()">
            {{ loading() ? '…' : 'Créer le compte' }}
          </button>
        </div>
      </form>
    }
  </div>
  <p class="hint">Astuce démo : <code>fedi&#64;esprit.tn</code> / <code>password</code> (ADMIN).</p>
</div>
