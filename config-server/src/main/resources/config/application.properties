# =====================================================================
# SHARED config — every microservice inherits these values automatically.
# Service-specific files (service-avis.properties, etc.) can override them.
# =====================================================================

# Where the Eureka registry lives. EUREKA_HOST defaults to "localhost" when you
# run on your machine, and is set to "eureka-server" by docker-compose.
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
# Register as "localhost" instead of the machine IP: this PC gets an APIPA address
# (169.254.x.x) that nothing can reach, which made the gateway answer 502.
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false

# Actuator endpoints exposed by every service
management.endpoints.web.exposure.include=health,info,prometheus
