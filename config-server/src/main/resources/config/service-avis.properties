server.port=8083

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/db_avis?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger/OpenAPI — served under the gateway route /api/avis/** for aggregation
springdoc.api-docs.path=/api/avis/v3/api-docs
