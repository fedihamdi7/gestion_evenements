server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Single-Page App: any unknown path falls back to index.html so Angular
    # routing (/events, /chat, ...) works on refresh / direct URL.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
