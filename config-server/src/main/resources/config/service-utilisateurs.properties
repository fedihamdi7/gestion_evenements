server.port=8081

# MySQL — MYSQL_HOST defaults to localhost, set to "mysql" by docker-compose.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/db_utilisateurs?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA — Hibernate creates/updates the "utilisateurs" table automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger/OpenAPI — serve the docs JSON under this service's gateway route (/api/users/**)
# so the API Gateway can fetch and aggregate it without any extra routing.
springdoc.api-docs.path=/api/users/v3/api-docs

# Include the exception message in error responses so the frontend can show "Email deja utilise", etc.
server.error.include-message=always

# ---------------------------------------------------------------------------
# Keycloak (login server). KEYCLOAK_HOST defaults to localhost, set to "keycloak"
# by docker-compose. Start it locally with ./keycloak/run-keycloak.ps1 (admin/admin).
# ---------------------------------------------------------------------------
keycloak.base-url=${KEYCLOAK_BASE_URL:http://${KEYCLOAK_HOST:localhost}:8080}
keycloak.realm=gestion-evenements
keycloak.client-id=service-utilisateurs
keycloak.admin.client-id=admin-cli
keycloak.admin.username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin}

# This service is an OAuth2 Resource Server: it validates Keycloak JWTs using Keycloak's
# public keys (JWKS).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${keycloak.base-url}/realms/${keycloak.realm}/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.issuer-uri=${keycloak.base-url}/realms/${keycloak.realm}
