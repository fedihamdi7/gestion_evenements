server.port=8082

spring.application.name=service-reservation

# H2 in-memory database — no installation needed, resets on every restart
spring.datasource.url=jdbc:h2:mem:db_reservation;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# H2 console — accessible at http://localhost:8082/h2-console (useful to inspect the DB)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Eureka — register this service in the registry
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info
