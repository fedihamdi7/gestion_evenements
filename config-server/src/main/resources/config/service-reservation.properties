server.port=8084

# H2 in-memory database — no installation needed, resets on every restart
spring.datasource.url=jdbc:h2:mem:db_reservation;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# H2 console — accessible at http://localhost:8084/h2-console (useful to inspect the DB)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger/OpenAPI — served under the gateway route /api/reservations/** for aggregation
springdoc.api-docs.path=/api/reservations/v3/api-docs
