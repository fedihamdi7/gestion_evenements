server:
  port: 9090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: service-utilisateurs
              uri: lb://service-utilisateurs
              predicates:
                - Path=/api/users/**
            - id: service-evenements
              uri: lb://service-evenements
              predicates:
                - Path=/api/events/**
            - id: service-avis
              uri: lb://service-avis
              predicates:
                - Path=/api/avis/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway